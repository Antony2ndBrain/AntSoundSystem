<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desain Sistem IEM · GPdI Victory Metro Permata</title>
<meta name="description" content="IEM (In-Ear Monitor) system design for GPdI Victory Metro Permata — Phase 1: Musicians.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
/* =====================================================================
   TOKENS
   ===================================================================== */
:root {
  --bg: #B3B3B3;
  --grid: rgba(255, 255, 255, .26);
  --ink: #111111;
  --ink-2: #2a2a2a;
  --muted: #4a4a4a;
  --paper: #F6F6F3;
  --paper-grid: rgba(0, 0, 0, .045);
  --band: #0B5FB0;
  --own: #C2410C;
  --iem: #7A2E9E;
  --foh: #4A4A4A;
  --warn: #B42318;
  --ok: #1E7B34;
  --accent: #FFD400;
  --font: "Space Grotesk", "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --nav-h: 58px;
  --radius: 14px;
  --shadow: 6px 6px 0 #111;
}
@media (max-width: 760px) { :root { --nav-h: 96px; } }

/* =====================================================================
   BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; animation: none !important; } }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px;
  overflow-x: hidden;
}
main { overflow-x: clip; }
h1, h2, h3, h4 { line-height: 1.15; margin: 0 0 .5em; }
p { margin: 0 0 1em; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
.wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 16px; position: relative; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--accent); color: var(--ink); padding: 8px 14px; border-radius: 8px; font-weight: 700; }
.skip:focus { top: 12px; }

/* =====================================================================
   NAV
   ===================================================================== */
.nav { position: sticky; top: 0; z-index: 50; background: var(--ink); color: #fff; border-bottom: 3px solid #000; }
.nav-inner { max-width: 1240px; margin: 0 auto; padding: 0 16px; min-height: var(--nav-h); display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; white-space: nowrap; letter-spacing: .02em; }
.brand svg { width: 20px; height: 20px; fill: var(--accent); }
.nav-links { list-style: none; margin: 0; padding: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.nav-links::-webkit-scrollbar { display: none; }
.nav-links a { display: block; padding: 8px 10px; text-decoration: none; font-size: 15px; white-space: nowrap; border-radius: 8px; color: #e8e8e8; }
.nav-links a:hover { background: #2a2a2a; color: #fff; }
.nav :focus-visible { outline-color: var(--accent); }
.lang { display: flex; align-items: center; gap: 2px; border: 2px solid #fff; border-radius: 999px; padding: 2px; flex: none; }
.lang button { background: transparent; border: 0; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; cursor: pointer; color: #fff; }
.lang button[aria-pressed="true"] { background: #fff; color: var(--ink); }
.lang .sep { opacity: .5; font-size: 13px; }
@media (max-width: 760px) {
  .nav-inner { flex-wrap: wrap; gap: 4px 12px; padding-top: 8px; padding-bottom: 4px; }
  .brand { flex: 1; }
  .nav-links { order: 3; flex-basis: 100%; margin: 0 -16px; padding: 0 10px 4px; }
  .nav-links a { font-size: 14px; padding: 6px 9px; }
}

/* =====================================================================
   SECTIONS + STARBURST TITLES
   ===================================================================== */
.section { position: relative; padding: 72px 0; scroll-margin-top: var(--nav-h); overflow: hidden; }
.section + .section { border-top: 2px dashed rgba(0, 0, 0, .18); }
.sec-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.burst {
  display: inline-block;
  margin: 0;
  background: var(--ink);
  color: #fff;
  font-weight: 700;
  letter-spacing: -.01em;
  text-align: center;
  font-size: clamp(1.45rem, 3.6vw, 2.3rem);
  line-height: 1.05;
  padding: 1.35em 2.3em;
  max-width: 100%;
  clip-path: polygon(50.0% 0.0%,58.2% 8.8%,69.1% 3.8%,73.3% 15.1%,85.4% 14.6%,84.9% 26.7%,96.2% 30.9%,91.2% 41.8%,100.0% 50.0%,91.2% 58.2%,96.2% 69.1%,84.9% 73.3%,85.4% 85.4%,73.3% 84.9%,69.1% 96.2%,58.2% 91.2%,50.0% 100.0%,41.8% 91.2%,30.9% 96.2%,26.7% 84.9%,14.6% 85.4%,15.1% 73.3%,3.8% 69.1%,8.8% 58.2%,0.0% 50.0%,8.8% 41.8%,3.8% 30.9%,15.1% 26.7%,14.6% 14.6%,26.7% 15.1%,30.9% 3.8%,41.8% 8.8%);
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.burst-xl { font-size: clamp(2rem, 7vw, 4.4rem); padding: 1.3em 1.9em; }
.chev { font-weight: 700; letter-spacing: .08em; color: var(--ink); font-size: 1.15rem; }
.chev::before { content: ">>>>>"; }
.chev-light { color: #fff; }
.lead { font-size: 1.1rem; max-width: 760px; }
.kicker { text-transform: uppercase; letter-spacing: .14em; font-size: 13px; font-weight: 700; margin-bottom: 6px; }

/* =====================================================================
   DECORATIONS (subtle)
   ===================================================================== */
.deco { position: absolute; pointer-events: none; z-index: 0; }
.deco-arcs { width: 260px; height: 260px; opacity: .55; }
.deco-star { width: 46px; height: 46px; opacity: .6; }
.deco-star.dark { fill: #6a6a6a; }
.deco-star.light { fill: #e4e4e4; }
.deco-checker { height: 16px; width: 220px; opacity: .55;
  background: conic-gradient(#111 25%, transparent 0 50%, #111 0 75%, transparent 0) 0 0 / 16px 16px; }
.section > .wrap, .hero > .wrap { z-index: 1; }

/* =====================================================================
   HERO
   ===================================================================== */
.hero { position: relative; padding: 64px 0 80px; overflow: hidden; }
.hero-inner { display: flex; flex-direction: column; align-items: flex-start; }
.hero-sub { font-size: clamp(1.15rem, 2.6vw, 1.55rem); font-weight: 700; margin: 18px 0 10px; max-width: 760px; }
.hero-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.chip { display: inline-block; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 2px 12px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.chip-dark { background: var(--ink); color: #fff; }
.tagline { font-size: clamp(1.3rem, 3vw, 1.9rem); font-weight: 700; font-style: italic; color: #fff; text-shadow: 2px 2px 0 var(--ink); margin: 18px 0 8px; }
.hero-lead { max-width: 640px; }
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 10px 18px; font-weight: 700; text-decoration: none; cursor: pointer; font-size: 15px; line-height: 1.2; }
.btn:hover { background: #333; }
.btn-ghost { background: #fff; color: var(--ink); }
.btn-ghost:hover { background: #ececec; }
.btn-sm { padding: 6px 14px; font-size: 14px; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--ink); }

/* =====================================================================
   CARDS / PANELS
   ===================================================================== */
.card { background: var(--paper); border: 2px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.paper-grid {
  background-color: var(--paper);
  background-image: linear-gradient(var(--paper-grid) 1px, transparent 1px), linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px);
  background-size: 20px 20px;
}

/* Existing system */
.sys-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.ch-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.ch-list li { background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 10px; display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
.ch-list li.is-empty { background: transparent; border-style: dashed; color: var(--muted); }
.ch-num { font-weight: 700; min-width: 52px; white-space: nowrap; }
.note { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; background: #fff; border-left: 6px solid var(--ink); padding: 10px 14px; border-radius: 0 10px 10px 0; margin: 0; }

/* Concept */
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 20px; margin-top: 8px; }
.step h3 { font-size: 1.2rem; }
.step-num { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: #fff; font-weight: 700; margin-bottom: 10px; }
.step p { margin: 0; }
.formula { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 26px; font-weight: 700; font-size: 1.1rem; }
.formula .op { font-size: 1.6rem; line-height: 1; }
.pill { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 6px 14px; }
.swatch { width: 40px; height: 12px; flex: none; }

/* Flow */
.flow-tools { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; margin: 6px 0 14px; }
.filter-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.filter-group .label { font-weight: 700; margin-right: 4px; }
.legend { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; }
.legend li { display: flex; align-items: center; gap: 8px; }
.legend small { color: var(--muted); }
.legend-title { font-weight: 700; font-size: 14px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .1em; }
.diagram-card { padding: 14px; }
.diagram { display: block; width: 100%; height: auto; }
.diagram-mobile { display: none; }
.hint { font-size: 14px; color: var(--muted); margin: 10px 0 0; }
@media (max-width: 900px) {
  .diagram-desktop { display: none; }
  .diagram-mobile { display: block; max-width: 520px; margin: 0 auto; }
  .diagram-card { padding: 8px; }
}

/* SVG diagrams */
.diagram text, .mini text, .sketch text { font-family: var(--font); }
.node-box { fill: #fff; stroke: var(--ink); stroke-width: 2; }
.node-label { font-weight: 700; font-size: 13px; fill: var(--ink); }
.node-sub { font-size: 10.5px; fill: #474747; }
.node-ring { fill: none; stroke: none; }
.kind-core .node-box { fill: var(--ink); }
.kind-core .node-label { fill: #fff; }
.kind-core .node-sub { fill: #d4d4d4; }
.kind-source .node-box { fill: #FFF1E8; }
.kind-iem .node-box { fill: #F5EDF9; stroke: var(--iem); stroke-width: 2.5; }
.kind-foh .node-box { fill: #E1E1E1; stroke: var(--foh); }
.kind-future .node-box { fill: #ECECEC; stroke: #7d7d7d; stroke-dasharray: 5 4; }
.kind-future .node-label, .kind-future .node-sub { fill: #5d5d5d; }
.kind-changing .node-box { stroke: var(--band); stroke-width: 4; }
.node[tabindex] { cursor: pointer; outline: none; }
.node[tabindex]:hover .node-box { stroke-width: 3.5; }
.node:focus-visible .node-ring, .node.is-selected .node-ring { stroke: var(--ink); stroke-width: 3; stroke-dasharray: 6 4; }
.lane rect { fill: rgba(255, 255, 255, .55); stroke: rgba(0, 0, 0, .18); stroke-width: 1.5; }
.lane-future rect { fill: none; stroke-dasharray: 6 5; }
.lane-title { font-size: 11px; font-weight: 700; letter-spacing: .12em; fill: var(--muted); }
.edge-tag rect { fill: var(--paper); stroke-width: 1.5; }
.edge-tag text { font-size: 10.5px; font-weight: 700; text-anchor: middle; }
.edge.is-future { opacity: .45; }
.edge-strong path { stroke-width: 5; }
.badge rect { fill: var(--band); }
.badge text { fill: #fff; font-size: 11px; font-weight: 700; text-anchor: middle; }
.node, .edge, .edge-tag { transition: opacity .18s ease; }
.is-tracing .node, .is-tracing .edge, .is-tracing .edge-tag { opacity: .14; }
.is-tracing .node.is-hot, .is-tracing .edge.is-hot, .is-tracing .edge-tag.is-hot { opacity: 1; }
.is-tracing .edge.is-hot path { stroke-width: 4.5; }

/* Musician cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 500px), 1fr)); gap: 24px; }
.mcard-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.mcard-head h3 { font-size: 1.5rem; margin: 0; }
.mini-wrap { border: 2px solid var(--ink); border-radius: 10px; padding: 6px; margin-bottom: 14px; }
.mini { display: block; width: 100%; max-width: 460px; height: auto; margin: 0 auto; }
.mini-mobile { display: none; max-width: 400px; }
@media (max-width: 640px) { .mini-desktop { display: none; } .mini-mobile { display: block; } }
@media print { .mini-desktop { display: block !important; } .mini-mobile { display: none !important; } }
.mtable { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.mtable th, .mtable td { text-align: left; vertical-align: top; padding: 8px; border: 1.5px solid var(--ink); }
.mtable th { background: var(--ink); color: #fff; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.mtable td { background: #fff; }
.req { margin-top: 18px; }
@media (max-width: 640px) {
  .mtable thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .mtable, .mtable tbody, .mtable tr, .mtable td { display: block; width: 100%; }
  .mtable td { border-top-width: 0; }
  .mtable td:first-child { border-top-width: 1.5px; border-radius: 8px 8px 0 0; }
  .mtable td:last-child { border-radius: 0 0 8px 8px; }
  .mtable td::before { content: attr(data-label); display: block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 2px; }
}

/* Pitfalls */
.pits { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 24px; }
.pit { border-top: 10px solid var(--warn); scroll-margin-top: calc(var(--nav-h) + 16px); }
.pit-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 10px; }
.pit-icon { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--warn); display: grid; place-items: center; }
.pit-icon svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pit-num { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--warn); }
.pit h3 { font-size: 1.15rem; margin: 2px 0 0; }
.pit-fix { background: #fff; border: 2px solid var(--ok); border-radius: 10px; padding: 10px 12px; }
.pit-fix strong:first-child { color: var(--ok); }
.sketch { display: block; width: 100%; max-width: 300px; height: auto; margin-top: 4px; }
.sketch .sk-box { fill: #fff; stroke: var(--ink); stroke-width: 1.5; }
.sketch .sk-t { font-size: 11px; font-weight: 700; text-anchor: middle; fill: var(--ink); }

/* Checklist */
.check-card { max-width: 860px; }
.progress-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.bar { flex: 1; min-width: 160px; height: 16px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--band); transition: width .25s ease; }
.progress-text { font-weight: 700; min-width: 110px; }
.check-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.check-item { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 10px 12px; }
.check-item input { appearance: none; -webkit-appearance: none; flex: none; width: 24px; height: 24px; margin: 1px 0 0; border: 2px solid var(--ink); border-radius: 6px; background: #fff; cursor: pointer; display: grid; place-items: center; }
.check-item input::after { content: ""; width: 7px; height: 13px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); opacity: 0; }
.check-item input:checked { background: var(--ok); border-color: var(--ok); }
.check-item input:checked::after { opacity: 1; }
.check-item label { cursor: pointer; flex: 1; }
.check-item.is-done label { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.qty { font-weight: 700; }

/* Phase 2 */
.p2-card { max-width: 860px; border-style: dashed; }
.p2-card ul { margin: 0 0 18px; padding-left: 1.2em; }
.p2-card li { margin-bottom: 6px; }

/* Footer */
.footer { background: var(--ink); color: #fff; padding: 34px 0 40px; position: relative; }
.footer .deco-checker { position: absolute; top: -8px; left: 0; width: 100%; opacity: 1; height: 16px;
  background: conic-gradient(#111 25%, #fff 0 50%, #111 0 75%, #fff 0) 0 0 / 16px 16px; }
.footer p { margin: 0; font-weight: 700; letter-spacing: .02em; }

/* =====================================================================
   SIDE PANEL / BOTTOM SHEET
   ===================================================================== */
.panel {
  position: fixed; z-index: 60;
  top: calc(var(--nav-h) + 14px); right: 14px; bottom: 14px;
  width: min(410px, calc(100vw - 28px));
  background: var(--paper); border: 2px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow);
  overflow-y: auto; overscroll-behavior: contain;
  transform: translateX(calc(100% + 30px)); visibility: hidden;
  transition: transform .25s ease, visibility 0s linear .25s;
}
.panel.open { transform: none; visibility: visible; transition: transform .25s ease, visibility 0s; }
.panel-head { position: sticky; top: 0; background: var(--ink); color: #fff; padding: 16px 16px 14px 18px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.panel-head h3 { font-size: 1.35rem; margin: 2px 0 2px; }
.panel-head p { margin: 0; font-size: 14px; color: #d6d6d6; }
.panel-kicker { text-transform: uppercase; letter-spacing: .12em; font-size: 11.5px !important; font-weight: 700; color: var(--accent) !important; }
.icon-btn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fff; background: transparent; color: #fff; font-size: 22px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
.icon-btn:hover { background: #fff; color: var(--ink); }
.panel-body { padding: 16px 18px 24px; font-size: 15.5px; }
.panel-body h4 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .12em; margin: 18px 0 8px; }
.panel-body h4:first-child { margin-top: 0; }
.conn-list, .watch-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.conn { background: #fff; border: 1.5px solid var(--ink); border-radius: 10px; padding: 8px 10px; }
.conn-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.conn-dir { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.conn-dev { background: none; border: 0; padding: 0; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }
.conn-meta { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; font-size: 14px; }
.sig-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
.sig-pill .swatch { width: 28px; height: 10px; }
.watch-list li { background: #fff; border-left: 5px solid var(--warn); border-radius: 0 8px 8px 0; padding: 7px 10px; }
.warn-h { color: var(--warn); }
.pit-link { font-weight: 700; }
@media (max-width: 760px) {
  .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 62vh; border-radius: 18px 18px 0 0; border-bottom: 0; box-shadow: 0 -6px 0 rgba(0, 0, 0, .9); transform: translateY(105%); }
  .panel-head::before { content: ""; position: absolute; top: 6px; left: 50%; width: 44px; height: 4px; margin-left: -22px; background: #666; border-radius: 4px; }
  .panel-head { padding-top: 20px; }
}

/* =====================================================================
   PRINT (A4 landscape)
   ===================================================================== */
@page { size: A4 landscape; margin: 10mm; }
@media print {
  :root { --nav-h: 0px; }
  body { background: #fff; font-size: 11pt; }
  .nav, .lang, .skip, .panel, .deco, .flow-tools .filter-group, #p2-toggle, #p2-show, #chk-reset, .hero-cta, .hint { display: none !important; }
  .section { padding: 18px 0; overflow: visible; break-inside: auto; }
  .section + .section { border-top: 0; }
  .hero { padding: 10px 0 18px; }
  .wrap { max-width: none; padding: 0; }
  .card { box-shadow: none; break-inside: avoid; }
  .diagram-desktop { display: block !important; }
  .diagram-mobile { display: none !important; }
  #flow, #musicians, #pitfalls, #checklist { break-before: page; }

const SVGNS = 'http://www.w3.org/2000/svg';
const $ = sel => document.querySelector(sel);
const DEV = Object.fromEntries(SYSTEM.devices.map(d => [d.id, d]));
const MUS = Object.fromEntries(SYSTEM.musicians.map(m => [m.id, m]));

function tr(obj) {
  if (obj == null) return '';
  if (typeof obj === 'string') return obj;
  return obj[state.lang] != null ? obj[state.lang] : (obj.en || '');
}
function ui(key, vars) {
  let s = (UI[state.lang] && UI[state.lang][key]);
  if (s == null) s = UI.en[key] != null ? UI.en[key] : key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? vars[k] : m));
  return s;
}
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else e.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const k of kids.flat(2)) if (k != null && k !== false) e.append(k);
  return e;
}
function svgEl(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) if (v != null && v !== '') e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function svgText(parent, x, y, str, attrs) {
  const t = svgEl('text', Object.assign({ x, y }, attrs || {}), parent);
  t.textContent = str;
  return t;
}
/* Minimal **bold** support for data strings → DocumentFragment */
function rich(str) {
  const frag = document.createDocumentFragment();
  String(str).split(/(\*\*[^*]+\*\*)/g).forEach(part => {
    if (!part) return;
    if (part.startsWith('**') && part.endsWith('**')) frag.append(h('strong', { text: part.slice(2, -2) }));
    else frag.append(part);
  });
  return frag;
}
const plain = str => String(str).replace(/\*\*/g, '');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cx = n => n.x + n.w / 2;
const cy = n => n.y + n.h / 2;
const isVisibleDev = d => !!d && (d.phase !== 2 || state.phase2);

function wrapText(str, maxChars, maxLines) {
  const words = String(str).split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (t.length > maxChars && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    const keep = lines.slice(0, maxLines);
    const rest = lines.slice(maxLines - 1).join(' ');
    keep[maxLines - 1] = rest.length > maxChars ? rest.slice(0, maxChars - 1).trimEnd() + '…' : rest;
    return keep;
  }
  return lines;
}

/* Small line sample in a signal's colour + line style */
function swatch(sigKey) {
  const sig = SYSTEM.signals[sigKey];
  const svg = svgEl('svg', { class: 'swatch', viewBox: '0 0 40 12', 'aria-hidden': 'true', focusable: 'false' });
  svgEl('line', { x1: 3, y1: 6, x2: 37, y2: 6, stroke: sig.color, 'stroke-width': Math.min(sig.width, 4), 'stroke-dasharray': sig.dash, 'stroke-linecap': sig.cap }, svg);
  return svg;
}

/* =========================================================================
   5. GRAPH ENGINE — builds layout models from SYSTEM and draws them as SVG
   ========================================================================= */
const DIR = { r: [1, 0], l: [-1, 0], t: [0, -1], b: [0, 1] };

/* Main IEM diagram model for a layout ('desktop' | 'mobile') */
function buildMainModel(mode) {
  const L = SYSTEM.layout.main[mode];
  const LN = L.lanes;
  const nodes = [];
  const lanes = [];
  const add = (d, p) => nodes.push({
    id: d.id, x: p.x, y: p.y, w: p.w || L.node.w, h: p.h || L.node.h,
    label: tr(d.label), sub: tr(d.sub), kind: d.kind, musician: d.musician || null, future: d.phase === 2
  });

  const maxCol = Math.max(...Object.values(LN.slots).map(s => s.col));
  const maxRow = Math.max(...Object.values(LN.slots).map(s => s.row));
  const laneW = maxCol * LN.colPitch + L.node.w + 2 * LN.padX;
  const row0 = [];
  let y = LN.y;

  SYSTEM.musicians.forEach(m => {
    const devs = SYSTEM.devices.filter(d => d.musician === m.id && d.slot && isVisibleDev(d));
    const used = [...new Set(devs.map(d => LN.slots[d.slot].row))].sort((a, b) => a - b);
    const rowOf = r => (LN.compress ? used.indexOf(r) : r);
    const nRows = LN.compress ? used.length : maxRow + 1;
    devs.forEach(d => {
      const s = LN.slots[d.slot];
      add(d, { x: LN.x + s.col * LN.colPitch, y: y + LN.head + rowOf(s.row) * LN.rowPitch });
    });
    const hgt = LN.head + (nRows - 1) * LN.rowPitch + L.node.h + LN.padB;
    lanes.push({ x: LN.x - LN.padX, y, w: laneW, h: hgt, title: `${tr(m.name)} · ${ui('lane_out', { n: m.out })}`.toUpperCase() });
    row0.push(y + LN.head);
    y += hgt + LN.gap;
  });

  // Phase 2 stacked below the lanes (mobile)
  if (L.phase2 && state.phase2) {
    const P = L.phase2;
    const devs = SYSTEM.devices.filter(d => d.phase === 2);
    const hgt = P.head + (devs.length - 1) * P.pitch + P.h + LN.padB;
    lanes.push({ x: LN.x - LN.padX, y, w: laneW, h: hgt, title: ui('p2_lane').toUpperCase(), future: true });
    devs.forEach((d, i) => add(d, { x: P.x, y: y + P.head + i * P.pitch, w: P.w, h: P.h }));
    y += hgt + LN.gap;
  }

  // Fixed (shared) devices
  const spanTop = row0[0];
  const spanBot = row0[row0.length - 1] + L.node.h;
  for (const [id, p] of Object.entries(L.fixed)) {
    const d = DEV[id];
    if (!isVisibleDev(d)) continue;
    const q = Object.assign({}, p);
    const hh = q.h || L.node.h;
    if (q.spanLanes) { q.y = spanTop; q.h = spanBot - spanTop; }
    if (q.y === 'mid') q.y = (spanTop + spanBot) / 2 - hh / 2;
    if (q.y === 'top') q.y = spanTop;
    add(d, q);
  }

  const ids = new Set(nodes.map(n => n.id));
  const edges = SYSTEM.connections
    .filter(c => ids.has(c.from) && ids.has(c.to))
    .map(c => ({
      from: c.from, to: c.to, signal: c.signal,
      tag: c.tag ? tr(c.tag) : null,
      ports: (L.ports && L.ports[`${c.from}>${c.to}`]) || null,
      bus: L.bus && L.bus.from === c.from ? L.bus.x : null,
      future: DEV[c.to].phase === 2
    }));
  return fitModel({ nodes, edges, lanes, badges: [] }, L.bus ? L.bus.x : 0);
}

/* Existing-system diagram model (section 2) */
function buildExistingModel(mode) {
  const L = SYSTEM.layout.existing[mode];
  const E = SYSTEM.existing;
  const box = (id, p, src, kind) => ({ id, x: p.x, y: p.y, w: p.w || L.node.w, h: p.h || L.node.h, label: tr(src.label), sub: tr(src.sub), kind });
  const nodes = [
    box('ex_stage', L.stage, E.stage, 'source'),
    box('ex_snake', L.snake, E.snake, 'device'),
    box('ex_mixer', L.mixer, E.mixer, 'core')
  ];
  const edges = [
    { from: 'ex_stage', to: 'ex_snake', signal: 'foh' },
    { from: 'ex_snake', to: 'ex_mixer', signal: 'foh' }
  ];
  const badges = [];
  E.outputs.forEach((o, i) => {
    const port = tr(o.port);
    const via = o.via ? tr(o.via) : '';
    const n = {
      id: 'ex_' + o.id, x: L.outs.x, y: L.outs.y + i * L.outs.pitch, w: L.outs.w, h: L.outs.h,
      label: tr(o.dest), sub: L.tags ? port : [port, via].filter(Boolean).join(' · '),
      kind: o.changing ? 'changing' : 'device'
    };
    nodes.push(n);
    edges.push({ from: 'ex_mixer', to: n.id, signal: o.signal, tag: L.tags && via ? via : null, bus: L.bus ? L.bus.x : null, strong: !!o.changing });
    if (o.changing) {
      const text = ui('sys_changing');
      const w = text.length * 6.6 + 22;
      badges.push({ x: n.x + n.w - w, y: n.y + n.h + 6, w, h: 20, text });
    }
  });
  return fitModel({ nodes, edges, lanes: [], badges }, L.bus ? L.bus.x : 0);
}

/* Mini diagram model for one musician card */
function buildMiniModel(m, mode) {
  const L = SYSTEM.layout.mini[mode];
  const devs = SYSTEM.devices.filter(d => d.musician === m.id && d.slot);
  const used = [...new Set([...devs.map(d => L.slots[d.slot].row), L.slots.feed.row])].sort((a, b) => a - b);
  const rowOf = r => (L.compress ? used.indexOf(r) : r);
  const pos = slot => ({ x: L.x + L.slots[slot].col * L.colPitch, y: L.y + rowOf(L.slots[slot].row) * L.rowPitch, w: L.node.w, h: L.node.h });
  const ids = new Set(devs.map(d => d.id));
  const nodes = devs.map(d => Object.assign({ id: d.id, label: tr(d.label), sub: tr(d.sub), kind: d.kind }, pos(d.slot)));
  nodes.push(Object.assign({ id: 'feed', label: 'HA800', sub: `Out ${m.out}`, kind: 'core' }, pos('feed')));
  const edges = SYSTEM.connections
    .filter(c => ids.has(c.to) && (ids.has(c.from) || c.from === 'ha800'))
    .map(c => ({ from: ids.has(c.from) ? c.from : 'feed', to: c.to, signal: c.signal, ports: L.ports[`${c.from}>${c.to}`] || null }));
  return fitModel({ nodes, edges, lanes: [], badges: [] }, 0);
}

function fitModel(model, busX) {
  let w = busX || 0, hgt = 0;
  [...model.nodes, ...model.lanes, ...model.badges].forEach(b => { w = Math.max(w, b.x + b.w); hgt = Math.max(hgt, b.y + b.h); });
  model.width = Math.ceil(w + 12);
  model.height = Math.ceil(hgt + 12);
  return model;
}

/* Work out where each line leaves/enters a box, then build the path */
function routeEdges(model) {
  const byId = Object.fromEntries(model.nodes.map(n => [n.id, n]));
  const ends = new Map();
  const push = (key, v) => { if (!ends.has(key)) ends.set(key, []); ends.get(key).push(v); };

  const sides = model.edges.map((e, i) => {
    if (e.bus != null) return null;
    const a = byId[e.from], b = byId[e.to];
    let s1, s2;
    if (e.ports) [s1, s2] = e.ports;
    else if (a.x < b.x + b.w && b.x < a.x + a.w) { s1 = cy(b) > cy(a) ? 'b' : 't'; s2 = s1 === 'b' ? 't' : 'b'; }
    else { s1 = cx(b) > cx(a) ? 'r' : 'l'; s2 = s1 === 'r' ? 'l' : 'r'; }
    push(a.id + '|' + s1, { i, end: 0, other: b });
    push(b.id + '|' + s2, { i, end: 1, other: a });
    return [s1, s2];
  });

  const pts = model.edges.map(() => [null, null]);
  ends.forEach((list, key) => {
    const [id, side] = key.split('|');
    const n = byId[id];
    const vert = side === 'l' || side === 'r';
    const start = vert ? n.y : n.x;
    const len = vert ? n.h : n.w;
    const big = o => (vert ? o.h : o.w) > 200;
    // reference coordinate of the other box: its centre, or (if it is a tall/wide box) the point nearest this one
    const ref = o => vert
      ? (big(o) ? clamp(cy(n), o.y, o.y + o.h) : cy(o))
      : (big(o) ? clamp(cx(n), o.x, o.x + o.w) : cx(o));
    list.sort((p, q) => ref(p.other) - ref(q.other));
    list.forEach((p, k) => {
      const pos = len > 200
        ? clamp(ref(p.other), start + 14, start + len - 14)
        : start + len * (k + 1) / (list.length + 1);
      pts[p.i][p.end] = side === 'r' ? [n.x + n.w, pos] : side === 'l' ? [n.x, pos] : side === 't' ? [pos, n.y] : [pos, n.y + n.h];
    });
  });

  return model.edges.map((e, i) => {
    const a = byId[e.from], b = byId[e.to];
    if (e.bus != null) return { d: busPath(a.x + a.w, cy(a), e.bus, b.x + b.w, cy(b)), mid: null };
    const [p1, p2] = pts[i];
    const [s1, s2] = sides[i];
    const dist = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    const k = clamp(dist * 0.42, 18, 90);
    const c1 = [p1[0] + DIR[s1][0] * k, p1[1] + DIR[s1][1] * k];
    const c2 = [p2[0] + DIR[s2][0] * k, p2[1] + DIR[s2][1] * k];
    const mid = [0, 1].map(j => (p1[j] + 3 * c1[j] + 3 * c2[j] + p2[j]) / 8);
    const f = p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
    return { d: `M${f(p1)} C${f(c1)} ${f(c2)} ${f(p2)}`, mid };
  });
}

function busPath(x1, y1, bx, x2, y2) {
  const r = 8;
  const sg = Math.sign(y2 - y1) || 1;
  if (Math.abs(y2 - y1) < 2 * r) return `M${x1} ${y1} H${bx} V${y2} H${x2}`;
  return `M${x1} ${y1} H${bx - r} Q${bx} ${y1} ${bx} ${y1 + sg * r} V${y2 - sg * r} Q${bx} ${y2} ${bx - r} ${y2} H${x2}`;
}

/* Draw a model into an <svg>. opt: { prefix, interactive, tags } */
function drawGraph(svg, model, opt) {
  svg.textContent = '';
  svg.setAttribute('viewBox', `0 0 ${model.width} ${model.height}`);
  const defs = svgEl('defs', null, svg);
  Object.entries(SYSTEM.signals).forEach(([k, sig]) => {
    const m = svgEl('marker', { id: `${opt.prefix}-arrow-${k}`, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 10, markerHeight: 10, markerUnits: 'userSpaceOnUse', orient: 'auto' }, defs);
    svgEl('path', { d: 'M0,0 L10,5 L0,10 z', fill: sig.color }, m);
  });

  const gLanes = svgEl('g', { class: 'lanes', 'aria-hidden': 'true' }, svg);
  model.lanes.forEach(l => {
    const g = svgEl('g', { class: 'lane' + (l.future ? ' lane-future' : '') }, gLanes);
    svgEl('rect', { x: l.x, y: l.y, width: l.w, height: l.h, rx: 12 }, g);
    svgText(g, l.x + 12, l.y + 17, l.title, { class: 'lane-title' });
  });

  const gEdges = svgEl('g', { class: 'edges', 'aria-hidden': 'true' }, svg);
  const gTags = svgEl('g', { class: 'tags', 'aria-hidden': 'true' }, svg);
  const gNodes = svgEl('g', { class: 'nodes' }, svg);

  const geo = routeEdges(model);
  model.edges.forEach((e, i) => {
    const sig = SYSTEM.signals[e.signal];
    const r = geo[i];
    const g = svgEl('g', { class: `edge sig-${e.signal}${e.future ? ' is-future' : ''}${e.strong ? ' edge-strong' : ''}`, 'data-from': e.from, 'data-to': e.to }, gEdges);
    svgEl('path', {
      d: r.d, fill: 'none', stroke: sig.color, 'stroke-width': sig.width,
      'stroke-dasharray': sig.dash, 'stroke-linecap': sig.cap, 'stroke-linejoin': 'round',
      'marker-end': `url(#${opt.prefix}-arrow-${e.signal})`
    }, g);
    if (opt.tags && e.tag && r.mid) {
      const tw = e.tag.length * 6.2 + 14;
      const tg = svgEl('g', { class: 'edge-tag' + (e.future ? ' is-future' : ''), 'data-from': e.from, 'data-to': e.to }, gTags);
      svgEl('rect', { x: (r.mid[0] - tw / 2).toFixed(1), y: (r.mid[1] - 9).toFixed(1), width: tw.toFixed(1), height: 18, rx: 9, stroke: sig.color }, tg);
      svgText(tg, r.mid[0].toFixed(1), (r.mid[1] + 3.8).toFixed(1), e.tag, { fill: sig.color });
    }
  });

  model.badges.forEach(b => {
    const g = svgEl('g', { class: 'badge', 'aria-hidden': 'true' }, gNodes);
    svgEl('rect', { x: b.x, y: b.y, width: b.w, height: b.h, rx: b.h / 2 }, g);
    svgText(g, b.x + b.w / 2, b.y + 14, b.text);
  });

  model.nodes.forEach(n => drawNode(gNodes, n, opt));
}

function drawNode(parent, n, opt) {
  const g = svgEl('g', { class: `node kind-${n.kind}`, 'data-id': n.id, transform: `translate(${n.x} ${n.y})` }, parent);
  if (opt.interactive) {
    g.setAttribute('tabindex', '0');
    g.setAttribute('role', 'button');
    g.setAttribute('aria-label', ui(n.future ? 'node_aria_future' : 'node_aria', { label: n.label, sub: n.sub }));
  }
  svgEl('rect', { class: 'node-ring', x: -5, y: -5, width: n.w + 10, height: n.h + 10, rx: 12 }, g);
  svgEl('rect', { class: 'node-box', width: n.w, height: n.h, rx: 9 }, g);

  const LS = 13, SS = 10.5;
  const tall = n.h > 100;
  let labelLines = wrapText(n.label, Math.floor((n.w - 12) / (LS * 0.56)), tall ? 3 : 2);
  let subLines = n.sub ? wrapText(n.sub, Math.floor((n.w - 10) / (SS * 0.52)), tall ? 4 : 2) : [];
  const lh1 = LS + 3, lh2 = SS + 3;
  while (labelLines.length * lh1 + subLines.length * lh2 > n.h - 6 && subLines.length) subLines.pop();
  const total = labelLines.length * lh1 + subLines.length * lh2;
  let y = (n.h - total) / 2;
  const tx = n.w / 2;
  labelLines.forEach(line => { svgText(g, tx, (y + LS).toFixed(1), line, { class: 'node-label', 'text-anchor': 'middle' }); y += lh1; });
  subLines.forEach(line => { svgText(g, tx, (y + SS + 0.5).toFixed(1), line, { class: 'node-sub', 'text-anchor': 'middle' }); y += lh2; });
}

/* ---- Path tracing (hover / select / filter) ---- */
const OUT = {}, IN = {};
SYSTEM.connections.forEach(c => {
  (OUT[c.from] = OUT[c.from] || []).push(c.to);
  (IN[c.to] = IN[c.to] || []).push(c.from);
});
function walk(start, adj, set) {
  const stack = [start];
  while (stack.length) {
    const id = stack.pop();
    (adj[id] || []).forEach(n => { if (!set.has(n)) { set.add(n); stack.push(n); } });
  }
  return set;
}
function pathSet(id) {
  const set = new Set([id]);
  walk(id, IN, set);
  walk(id, OUT, set);
  return set;
}
function filterSet(mid) {
  const set = new Set();
  SYSTEM.devices.filter(d => d.musician === mid).forEach(d => { set.add(d.id); walk(d.id, IN, set); });
  return set;
}
function activeSet() {
  const id = state.hover || state.selected;
  if (id) return pathSet(id);
  if (state.filter !== 'all') return filterSet(state.filter);
  return null;
}
function applyHighlight() {
  const set = activeSet();
  document.querySelectorAll('.diagram-main').forEach(svg => {
    svg.classList.toggle('is-tracing', !!set);
    svg.querySelectorAll('.node').forEach(n => {
      n.classList.toggle('is-hot', !!set && set.has(n.dataset.id));
      n.classList.toggle('is-selected', n.dataset.id === state.selected);
    });
    const layer = svg.querySelector('.edges');
    svg.querySelectorAll('.edge, .edge-tag').forEach(e => {
      const hot = !!set && set.has(e.dataset.from) && set.has(e.dataset.to);
      e.classList.toggle('is-hot', hot);
      if (hot && layer && e.classList.contains('edge')) layer.appendChild(e); // draw on top
    });
  });
}

  if (!d) return;
  const m = d.musician ? MUS[d.musician] : null;
  $('#panel-kicker').textContent = d.phase === 2 ? ui('panel_future') : m ? ui('panel_chain', { name: tr(m.name) }) : ui('panel_shared');
  $('#panel-title').textContent = tr(d.label);
  $('#panel-sub').textContent = tr(d.sub);
  const body = $('#panel-body');
  body.textContent = '';
  body.append(h('h4', { text: ui('panel_role') }), h('p', null, rich(tr(d.role))));

  const conns = SYSTEM.connections.filter(c => (c.from === d.id || c.to === d.id) && isVisibleDev(DEV[c.from]) && isVisibleDev(DEV[c.to]));
  if (conns.length) {
    body.append(h('h4', { text: ui('panel_conn') }));
    body.append(h('ul', { class: 'conn-list' }, conns.map(c => {
      const incoming = c.to === d.id;
      const other = DEV[incoming ? c.from : c.to];
      return h('li', { class: 'conn' },
        h('div', { class: 'conn-top' },
          h('span', { class: 'conn-dir', text: ui(incoming ? 'panel_in' : 'panel_out') }),
          h('button', { type: 'button', class: 'conn-dev', 'data-goto': other.id, text: tr(other.label) })),
        h('div', { class: 'conn-meta' },
          sigPill(c.signal),
          c.cable ? h('span', null, h('strong', { text: ui('panel_cable') + ': ' }), tr(c.cable)) : null));
    })));
  }

  const notes = (d.notes || []).map(n => h('li', null, rich(tr(n))));
  const pits = (d.pitfalls || []).map(n => {
    const p = SYSTEM.pitfalls.find(x => x.n === n);
    return p ? h('li', null, h('a', { href: `#pit-${n}`, class: 'pit-link', text: `${ui('pit_num', { n })}: ${tr(p.title)}` })) : null;
  });
  if (notes.length || pits.length) {
    body.append(h('h4', { class: 'warn-h', text: ui('panel_watch') }), h('ul', { class: 'watch-list' }, notes, pits));
  }
}
function openPanel(id, trigger) {
  if (!DEV[id]) return;
  state.selected = id;
  if (trigger) panelTrigger = trigger;
  renderPanel();
  const panel = $('#panel');
  panel.classList.add('open');
  panel.scrollTop = 0;
  applyHighlight();
  $('#panel-close').focus({ preventScroll: true });
}
function closePanel(restoreFocus) {
  const panel = $('#panel');
  if (!panel.classList.contains('open')) return;
  panel.classList.remove('open');
  const id = state.selected;
  state.selected = null;
  applyHighlight();
  if (restoreFocus) {
    let t = panelTrigger && document.contains(panelTrigger) ? panelTrigger : null;
    if (!t && id) t = [...document.querySelectorAll(`.diagram-main .node[data-id="${id}"]`)].find(n => n.getClientRects().length);
    if (t) t.focus({ preventScroll: true });
  }
  panelTrigger = null;
}

/* ---- Language ---- */
function setLanguage(lang) {
  state.lang = lang === 'en' ? 'en' : 'id';
  store.set(KEY_LANG, state.lang);
  document.documentElement.lang = state.lang;
  document.title = ui('docTitle');
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
  renderAll();
}

function renderAll() {
  applyStaticI18n();
  renderExisting();
  renderFormula();
  renderLegend();
  renderFilters();
  syncPhase2Buttons();
  renderDiagram();
  renderCards();
  renderPitfalls();
  renderChecklist();
  if (state.selected) renderPanel();
}

/* =========================================================================
   7. INTERACTIONS
   ========================================================================= */
function setHover(id) {
  if (state.hover === id) return;
  state.hover = id;
  applyHighlight();
}
function setPhase2(on) {
  state.phase2 = on;
  if (!on && state.selected && DEV[state.selected].phase === 2) closePanel(false);
  syncPhase2Buttons();
  renderDiagram();
  if (state.selected) renderPanel();
}

function bindDiagram(svg) {
  svg.addEventListener('pointerover', e => { const n = e.target.closest('.node'); if (n) setHover(n.dataset.id); });
  svg.addEventListener('pointerout', e => {
    const n = e.target.closest('.node');
    if (n && !(e.relatedTarget && n.contains(e.relatedTarget))) setHover(null);
  });
  svg.addEventListener('focusin', e => { const n = e.target.closest('.node'); if (n) setHover(n.dataset.id); });
  svg.addEventListener('focusout', () => setHover(null));
  svg.addEventListener('click', e => { const n = e.target.closest('.node'); if (n) openPanel(n.dataset.id, n); });
  svg.addEventListener('keydown', e => {
    const n = e.target.closest('.node');
    if (n && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openPanel(n.dataset.id, n); }
  });
}

function bindEvents() {
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLanguage(b.dataset.lang)));

  $('#filters').addEventListener('click', e => {
    const b = e.target.closest('[data-filter]');
    if (!b) return;
    state.filter = b.dataset.filter;
    $('#filters').querySelectorAll('[data-filter]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.filter === state.filter)));
    applyHighlight();
  });

  $('#p2-toggle').addEventListener('click', () => setPhase2(!state.phase2));
  $('#p2-show').addEventListener('click', () => {
    setPhase2(!state.phase2);
    if (state.phase2) $('#flow').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });

  document.querySelectorAll('.diagram-main').forEach(bindDiagram);

  $('#panel-close').addEventListener('click', () => closePanel(true));
  $('#panel-body').addEventListener('click', e => {
    const go = e.target.closest('[data-goto]');
    if (go) { openPanel(go.dataset.goto); return; }
    if (e.target.closest('.pit-link')) closePanel(false);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(true); });
  document.addEventListener('click', e => {
    if (!$('#panel').classList.contains('open')) return;
    if (e.target.closest('#panel') || e.target.closest('.diagram-main .node')) return;
    closePanel(false);
  });

  $('#check-list').addEventListener('change', e => {
    const input = e.target.closest('input[type="checkbox"]');
    if (!input) return;
    const id = input.dataset.id;
    if (input.checked) state.checked.add(id); else state.checked.delete(id);
    input.closest('.check-item').classList.toggle('is-done', input.checked);
    saveChecklist();
    updateProgress();
  });
  $('#chk-reset').addEventListener('click', () => {
    state.checked.clear();
    saveChecklist();
    renderChecklist();
  });

  // Print always uses the desktop diagram; drop transient highlights first
  window.addEventListener('beforeprint', () => { state.hover = null; applyHighlight(); });
}

/* =========================================================================
   8. INIT
   ========================================================================= */
function init() {
  const saved = store.get(KEY_LANG);
  loadChecklist();
  bindEvents();
  setLanguage(saved === 'en' || saved === 'id' ? saved : 'id');
}
init();
</script>
</body>
